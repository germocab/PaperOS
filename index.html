<style>

.device{position:relative}

.hw-top:active{transform:translateY(2px);filter:brightness(.85)}.hw-side:active{transform:translateX(-2px);filter:brightness(.85)}

.chips.wrap{flex-wrap:wrap;overflow:visible}

.bkstks{display:flex;gap:6px;overflow-x:auto;margin-top:8px;scrollbar-width:none}.bkstks::-webkit-scrollbar{display:none}

.sw-midnight{background:var(--g-midnight)}.sw-lightning{background:var(--g-lightning)}.sw-obsidian{background:var(--g-obsidian)}.sw-blue{background:var(--g-blue)}.sw-green{background:var(--g-green)}.sw-auto{background:var(--g-auto)}
.sheet input.rn{width:100%;padding:12px;border-radius:12px;border:2px solid var(--ink);background:var(--btn);color:var(--ink);font:500 15px 'DM Sans',system-ui,sans-serif;margin-bottom:10px;outline:none}.book small{color:var(--mut);font-size:12px}

/* full view */
.device{transition:padding .4s cubic-bezier(.2,.8,.2,1),border-radius .4s,width .4s cubic-bezier(.2,.8,.2,1),height .4s cubic-bezier(.2,.8,.2,1),translate .3s cubic-bezier(.2,.8,.2,1),background-color .35s}
.device.full{width:100vw;height:100%;max-height:none;padding:0;border-radius:0;background:transparent;box-shadow:none}
.full .screen{border-radius:0}
.full .top,.full .text,.full .body,.full .trk{width:100%;max-width:760px;margin-left:auto;margin-right:auto}
.full .bar{max-width:740px;width:calc(100% - 20px);margin:0 auto}
/* finish */
.fin{position:relative;flex:1;overflow-x:hidden;overflow-y:auto;color:var(--ink);background:radial-gradient(120% 90% at 50% 30%,color-mix(in srgb,var(--ink) 8%,var(--screen)) 0%,var(--screen) 72%);display:flex;flex-direction:column;align-items:center;justify-content:safe center;padding:20px 22px;text-align:center}

function setBezel(k){S.bezel=k;save();render()}
function setDcol(k){S.dcol=k;save();render()}
const WBG=[['Gray',null],['Charcoal','#2b2b2e'],['Black','#000000'],['White','#f2f2f2'],['Sand','#d9c9a8'],['Sage','#8fa88f'],['Sky','#7fa6c9'],['Rose','#c99aa5']];
function applyWeb(){const e=document.documentElement;
 if(/^#[0-9a-f]{6}$/i.test(S.wbg||''))e.style.setProperty('--bg',S.wbg);else e.style.removeProperty('--bg');
 const m=document.querySelector('meta[name=theme-color]');if(m)m.content=S.wbg||'#111111'}
function setWbg(c,noRender){S.wbg=c;applyWeb();save();if(!noRender)render()}
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const V={home,books,ctrl,read,rctrl,track,chapters,notes,text,done};

/* actions */
function tap(e){
 if(getSelection().toString().trim())return;
 if(S.hp){hidePal();return}
 const r=e.currentTarget.getBoundingClientRect(),x=(e.clientX-r.left)/r.width;
 if(x<.3)turn(-1);else if(x>.7)turn(1);else if(!logoOn())go('rctrl')}
function turn(d){const b=book(),n=b.page+d;
 if(S.spK===b.id+'|'+b.page){
  if(d>0&&S.sp<(S.nsub||1)-1){S.sp++;b.last=Date.now();S.pt='next';return render()}
  if(d<0&&S.sp>0){S.sp--;b.last=Date.now();S.pt='prev';return render()}}
 if(n<0)return toast('First page');if(n>=b.pages.length)return finish();
 b.page=n;b.last=Date.now();S.spK=b.id+'|'+n;S.sp=d>0?0:1e6;S.pt=d>0?'next':'prev';save();render()}
/* highlighter */
const PAL=`<div class="hlpal" role="toolbar" aria-label="Highlighter" onmousedown="event.preventDefault()"><button class="hl-y" aria-label="Yellow highlighter" onclick="hlAdd('y')"></button><button class="hl-g" aria-label="Green highlighter" onclick="hlAdd('g')"></button><button class="hl-b" aria-label="Blue highlighter" onclick="hlAdd('b')"></button><button class="er" aria-label="Remove highlight" onclick="hlErase()">${svg('x')}</button></div>`;
function hidePal(){document.querySelector('.hlpal')?.remove();S.hp=null}
function subOff(el,node,off,edge){const ps=[...el.querySelectorAll('p')];let base=0;
 for(const p of ps){if(p.contains(node)){const g=document.createRange();g.selectNodeContents(p);g.setEnd(node,off);return base+g.toString().length}base+=p.textContent.length+2}
 if(node===el){let x=0;for(let i=0;i<Math.min(off,ps.length);i++)x+=ps[i].textContent.length+2;return edge==='end'?Math.max(0,x-2):x}
 return null}
function checkSel(){
 if(S.screen!=='read'||S.sheet)return hidePal();
 const el=$('#txt'),sel=getSelection(),b=book();
 if(!el||!b||!sel||!sel.rangeCount||sel.isCollapsed||S.subTxt==null)return hidePal();
 const r=sel.getRangeAt(0);
 if(!el.contains(r.startContainer)||!el.contains(r.endContainer))return hidePal();
 const so=subOff(el,r.startContainer,r.startOffset,'start'),eo=subOff(el,r.endContainer,r.endOffset,'end');
 if(so==null||eo==null)return hidePal();
 let a=null,z=0,i=0,m;const re=/\S+/g,t=S.subTxt;
 while((m=re.exec(t))){if(a===null&&m.index+m[0].length>so)a=i;if(m.index<eo)z=i+1;i++}
 if(a===null||z<=a)return hidePal();
 const tb=S.subTb||0;S.hp={a:a+tb,z:z+tb};
 if(!$('.hlpal'))$('#scr').insertAdjacentHTML('beforeend',PAL)}
let selT;document.addEventListener('selectionchange',()=>{clearTimeout(selT);selT=setTimeout(checkSel,160)});
function hlAdd(c){const b=book(),h=S.hp;if(!b||!h)return;
 const t=b.pages[b.page].split(/\s+/).filter(Boolean).slice(h.a,h.z).join(' ');
 S.hls.push({id:Date.now()+'-'+Math.random().toString(36).slice(2,6),b:b.id,p:b.page,a:h.a,z:h.z,c,t:t.length>240?t.slice(0,240)+'…':t,at:Date.now()});
 save();try{getSelection().removeAllRanges()}catch(e){}render();toast('Highlight saved to Bookmark')}
function hlErase(){const b=book(),h=S.hp;if(!b||!h)return;const n=S.hls.length;
 S.hls=S.hls.filter(x=>!(x.b===b.id&&x.p===b.page&&x.a<h.z&&x.z>h.a));
 save();try{getSelection().removeAllRanges()}catch(e){}render();toast(S.hls.length<n?'Highlight removed':'No highlight there')}
/* hardware buttons */
const logoOn=()=>S.plogo!==false;
const PACT=[['next','Next page'],['prev','Previous page'],['dark','Toggle Light/Dark mode'],['nod','Start No Distraction'],['chap','Next chapter'],['save','Save page'],['bm','Open Bookmarks'],['scr','Turn screen on/off']];
const hwMsg=m=>toast(m,2000);
function setHw(k,v){S[k]=v;save();render()}
function glow(side,col,id){const d=$('.device'),sc=$('#scr'),bt=document.getElementById(id);if(!d||!sc||!bt||!S.anim)return;
 const a=sc.getBoundingClientRect(),b=bt.getBoundingClientRect(),top=side==='top',
  p=top?b.left+b.width/2-a.left:b.top+b.height/2-a.top,half=(top?b.width:b.height)/2;
 const g=document.createElement('div');g.className='glow '+side;g.style.setProperty('--gc',col);g.style.setProperty('--p',p+'px');g.style.setProperty('--r',(half+24)+'px');d.append(g);setTimeout(()=>g.remove(),800)}
function hwPress(w){
 try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}
 glow(w==='a'?'top':'right',w==='a'?'#f4711a':w==='h'?'#5aa9ff':'#7b7f95',w==='a'?'hwA':w==='h'?'hwHome':'hwB');
 if(S.off){S.off=false;render();return hwMsg(w==='a'&&(S.pact||'next')==='scr'?'PaperAction - Screen on':'Screen on')}
 if(w==='h'){
  if(S.screen==='home'&&S.q!==null){closeSearch();return hwMsg('Home')}
  S.sheet=null;S.confirm=null;S.rename=null;S.bmenu=false;S.dmenu=false;S.hlEdit=null;
  if(S.screen==='home'){render();return hwMsg('Home - Already here')}
  go('home');return hwMsg('Home')}
 S.sheet=null;S.confirm=null;S.rename=null;S.bmenu=false;S.dmenu=false;
 if(w==='b'){
  if(S.screen==='ctrl'){closeCtrl();return hwMsg('PaperButton - Back')}
  go('ctrl');return hwMsg('PaperButton - PaperControls')}
 const a=S.pact||'next',name=(PACT.find(x=>x[0]===a)||PACT[0])[1],pre='PaperAction - ',
  reading=!!book()&&['read','rctrl','track'].includes(S.screen);
 if(a==='scr'){S.off=true;render();return}
 if(a==='bm'){go('notes');return hwMsg(pre+'Bookmarks')}
 if(a==='save'){if(!reading)return hwMsg(pre+name+' (open a book first)');savePage();return}
 if(a==='dark'){S.dark=!S.dark;save();render();return hwMsg(pre+(S.dark?'Dark mode':'Light mode'))}
 if(a==='nod'){
  if(!S.nod)return hwMsg(pre+'No Distraction is off in Settings');
  if(!nodOK())return hwMsg(pre+'No Distraction only works while reading');
  clearTimeout(nodT);nodT=null;S.nodHide=true;$('#scr').classList.add('nod');return hwMsg(pre+'No Distraction')}
 if(!reading)return hwMsg(pre+name+' (open a book first)');
 if(a==='next')turn(1);else if(a==='prev')turn(-1);else jump(1);
 hwMsg(pre+name)}
function finish(){const b=book();b.done=Date.now();save();go('done')}
function restart(id){const b=S.books.find(x=>x.id===id);if(b){b.page=0;b.secs=0;b.vis=[];b.done=0}openBook(id)}
const fmtT=n=>n<60?`${n}<small>sec</small>`:n<3600?`${Math.floor(n/60)}<small>min</small>`:`${Math.floor(n/3600)}<small>h</small> ${Math.floor(n%3600/60)}<small>m</small>`;
function runCount(){document.querySelectorAll('.st b').forEach((el,i)=>{const to=+el.dataset.t,f=el.dataset.k==='time'?fmtT:(n=>String(n));
 if(!S.anim){el.innerHTML=f(to);return}
 const t0=performance.now()+1550+i*250,dur=1400;
 const tick=now=>{const p=Math.min(1,Math.max(0,(now-t0)/dur)),e=1-Math.pow(1-p,3);el.innerHTML=f(Math.round(to*e));if(p<1)requestAnimationFrame(tick)};requestAnimationFrame(tick)})}
function jump(d){const b=book();let t;
 if(b.ch&&b.ch.length){const st=b.ch.map(x=>x.s);let i=0;st.forEach((v,k)=>{if(v<=b.page)i=k});
  t=d>0?st[Math.min(st.length-1,i+1)]:(b.page>st[i]?st[i]:st[Math.max(0,i-1)])}
 else{const g=Math.floor(b.page/10);t=d>0?(g+1)*10:(b.page%10?g*10:Math.max(0,g-1)*10)}
 b.page=Math.max(0,Math.min(b.pages.length-1,t));save();render()}
function scrub(v){const k=book();k.page=+v-1;fitText($('#tp'),k,0);$('#lbl').innerHTML=chInfo(k,'Page '+(k.page+1));save()}
function toggleGest(){S.gest=!S.gest;save();render();toast(S.gest?'Gestures on':'Gestures off')}
function toggleFull(){S.full=!S.full;save();
 try{if(S.full&&!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>{});else if(!S.full&&document.fullscreenElement)document.exitFullscreen?.().catch(()=>{})}catch(e){}
 render();toast(S.full?'Full View on':'Full View off')}
function toggleDmenu(){S.dmenu=!S.dmenu;render()}
function tog(k){S[k]=!S[k];S.dmenu=false;save();render()}
function savePage(){const b=book();if(!S.notes.some(n=>n.b===b.id&&n.p===b.page))S.notes.push({b:b.id,p:b.page});save();toast('Page bookmarked')}
function cycleTO(){S.timeout=S.timeout===0?1:S.timeout===1?5:0;save();resetSleep();render()}
function bright(){$('#scr').style.opacity=S.bright/100*.4+.6}
let sl;function resetSleep(){clearTimeout(sl);if(S.timeout)sl=setTimeout(()=>{const d=document.createElement('div');d.className='sleep';d.textContent='Paper';d.onclick=()=>{d.remove();resetSleep()};$('#scr').append(d)},S.timeout*60000)}
/* No Distraction: hide the status bar after 30 s without using it */
const NODS=['read','rctrl','track'],nodOK=()=>!!S.nod&&NODS.includes(S.screen);
let nodT=null;
function startNod(){clearTimeout(nodT);nodT=null;if(!nodOK())return;nodT=setTimeout(()=>{nodT=null;S.nodHide=true;$('#scr')?.classList.add('nod')},30000)}
/* battery (experimental) */
let battObj=null;
const battTxt=()=>{if(!S.batt)return'';if(!navigator.getBattery)return' · Battery N/A';if(S.bl==null)return' · …';return' · '+S.bl+'%'+(S.bch?' charging':'')};
function battInit(){if(battObj||!navigator.getBattery)return;
 navigator.getBattery().then(b=>{battObj=b;const u=()=>{S.bl=Math.round(b.level*100);S.bch=b.charging;const e=$('#batt');if(e)e.textContent=battTxt()};
  ['levelchange','chargingchange'].forEach(n=>b.addEventListener(n,u));u()}).catch(()=>{S.bl=null;const e=$('#batt');if(e)e.textContent=' · Battery N/A'})}
function render(){
 const s=$('#scr'),cur=S.screen,prev=S.shown,rg=['read','rctrl','track'];
 s.className='screen'+(S.dark?' dark':'')+(S.night?' warm':'')+(S.ccolor?' cc':'')+(S.hpos==='bottom'?' hb':'')+(nodOK()&&S.nodHide?' nod':'')+(logoOn()?'':' nologo');
 $('.device').className='device'+(S.anim?'':' noanim')+' f-'+frameKey()+(S.dark?' dark':'')+(S.full?' full':'')+(S.back?' isback':'');
 applyDev();renderBack();applyWeb();
 document.documentElement.dataset.theme=S.dark?'dark':'light';
 S.hp=null;
 s.innerHTML=V[S.screen]();
 if(S.screen==='home'&&S.q!==null){const rs=$('#res');if(rs)fillRes(rs,searchParts(S.q),S.q)}
 if(rg.includes(cur)){const bk=book();if(bk)layoutText(cur,bk)}
 if(S.sheet)s.insertAdjacentHTML('beforeend',sheet());
 if(S.bmenu&&cur==='books')s.insertAdjacentHTML('beforeend',bmenu());
 if(prev!==cur){
  if(rg.includes(prev)&&rg.includes(cur))s.querySelector('.bar,.trk')?.classList.add('drop-in');
  else if(cur!=='chapters'){s.classList.add('enter-'+({read:'zoom',ctrl:'drop'}[cur]||'fade'));
   if(['home','ctrl','notes','text'].includes(cur)){s.classList.add('stag');s.querySelectorAll('.body>*').forEach((e,i)=>e.style.setProperty('--i',i))}}
 }
 if(S.pt){$('.text')?.classList.add('turn-'+S.pt);S.pt=null}
 if(cur==='read'){const k=book();if(k){k.vis=k.vis||[];if(!k.vis.includes(k.page))k.vis.push(k.page)}}
 if(cur==='chapters'){const c=$('#chcur');if(c)c.scrollIntoView({block:'center'})}
 if(cur==='done'&&prev!==cur){runCount();if(S.anim)setTimeout(()=>{try{navigator.vibrate&&navigator.vibrate([40,60,40])}catch(e){}},1250)}
 if(nodOK()){if(prev!==cur){S.nodHide=false;s.classList.remove('nod');startNod()}else if(!nodT&&!S.nodHide)startNod()}
 else{clearTimeout(nodT);nodT=null;S.nodHide=false}
 if(S.batt&&cur==='ctrl')battInit();
 S.shown=cur;bright();resetSleep();
 if(S.off){const d=document.createElement('div');d.className='sleep off';d.setAttribute('aria-label','Screen off. Tap to turn on');d.onclick=()=>{S.off=false;render()};s.append(d)}
}
document.addEventListener('keydown',e=>{if(S.screen==='read'||S.screen==='rctrl'){if(e.key==='ArrowRight')turn(1);if(e.key==='ArrowLeft')turn(-1)}});
$('#file').onchange=e=>{importFiles([...e.target.files]);e.target.value=''};
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{e.preventDefault();importFiles([...e.dataTransfer.files])});
setInterval(()=>{if(S.screen==='home'||S.screen==='ctrl'){const b=document.querySelector('.top b');if(b)b.textContent=clock()}},20000);

setInterval(()=>{const b=book();if(b&&['read','rctrl','track','chapters'].includes(S.screen)&&!document.hidden){b.secs=(b.secs||0)+1;if(b.secs%15===0)save()}},1000);
/* long press on a book */
let lpT,lpDone=false,lx=0,ly=0;
const sc=$('#scr');
sc.addEventListener('pointerdown',e=>{lpDone=false;
 const lpEl=e.target.closest('[data-lp]');
 if(lpEl&&S.screen==='read'){lx=e.clientX;ly=e.clientY;clearTimeout(lpT);const dest=lpEl.dataset.lp;lpT=setTimeout(()=>{lpDone=true;try{navigator.vibrate&&navigator.vibrate(15)}catch(_){}go(dest)},480);return}
 const t=e.target.closest('[data-bid]');if(!t)return;lx=e.clientX;ly=e.clientY;clearTimeout(lpT);
 lpT=setTimeout(()=>{lpDone=true;try{navigator.vibrate&&navigator.vibrate(15)}catch(_){}openSheet(Number(t.dataset.bid))},480)});
sc.addEventListener('pointermove',e=>{if(Math.abs(e.clientX-lx)>8||Math.abs(e.clientY-ly)>8)clearTimeout(lpT)});
['pointerup','pointercancel','pointerleave'].forEach(n=>sc.addEventListener(n,()=>clearTimeout(lpT)));
sc.addEventListener('click',e=>{if(lpDone||Date.now()-swAt<350){e.stopPropagation();e.preventDefault();lpDone=false}},true);
sc.addEventListener('contextmenu',e=>{if(e.target.closest('[data-bid],[data-lp]'))e.preventDefault()});

/* swipe left/right on the page to turn it */
let swOn=false,swX=0,swY=0,swAt=0;
sc.addEventListener('pointerdown',e=>{swOn=S.screen==='read'&&!!S.gest&&!!e.target.closest('.text');swX=e.clientX;swY=e.clientY});
sc.addEventListener('pointercancel',()=>{swOn=false});
sc.addEventListener('pointerup',e=>{if(!swOn)return;swOn=false;if(getSelection().toString().trim())return;const dx=e.clientX-swX,dy=e.clientY-swY;
 if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){swAt=Date.now();turn(dx<0?1:-1)}});

/* swipe left on PaperHome resumes the last book */
let sx=0,sy=0,sOn=false;
sc.addEventListener('pointerdown',e=>{sOn=!e.target.closest('.row,input');sx=e.clientX;sy=e.clientY});
sc.addEventListener('pointerup',e=>{if(!sOn)return;sOn=false;const dx=e.clientX-sx,dy=e.clientY-sy;
 if(S.gest&&S.screen==='home'&&S.q===null&&!S.sheet&&!lpDone&&dx<-70&&Math.abs(dx)>Math.abs(dy)*1.6){
  const b=[...S.books].filter(x=>x.last).sort((a,c)=>c.last-a.last)[0]||book();if(!b)return toast('No book to resume');openBook(b.id)}});
/* swipe up anywhere in PaperControls to go back (touch events keep firing while the panel scrolls) */
let cu={on:0};
function cuStart(x,y,t){const b=$('.body');cu={on:S.screen==='ctrl'&&!!S.gest&&!t.closest('input'),x,y,bot:!b||b.scrollTop+b.clientHeight>=b.scrollHeight-2,st:b?b.scrollTop:0}}
function cuEnd(x,y){if(!cu.on)return;cu.on=0;const b=$('.body'),dx=x-cu.x,dy=y-cu.y;
 if(dy<-70&&-dy>Math.abs(dx)*1.5&&cu.bot&&(!b||b.scrollTop===cu.st)){swAt=Date.now();closeCtrl()}}
sc.addEventListener('touchstart',e=>{const t=e.touches[0];if(t)cuStart(t.clientX,t.clientY,e.target)},{passive:true});
sc.addEventListener('touchend',e=>{const t=e.changedTouches[0];if(t)cuEnd(t.clientX,t.clientY)},{passive:true});
sc.addEventListener('touchcancel',()=>{cu.on=0},{passive:true});
sc.addEventListener('pointerdown',e=>{if(e.pointerType!=='touch')cuStart(e.clientX,e.clientY,e.target)});
sc.addEventListener('pointerup',e=>{if(e.pointerType!=='touch')cuEnd(e.clientX,e.clientY)});
/* using the status bar keeps it visible; a tap on the hidden bar brings it back */
sc.addEventListener('pointerdown',e=>{if(!nodOK()||!e.target.closest('.top .info'))return;
 if(S.nodHide){S.nodHide=false;$('#scr').classList.remove('nod');swAt=Date.now()+250}
 startNod()},true);
/* swipe down from the top of PaperHome opens Paper Controls */
let dnOn=false,dnX=0,dnY=0;
sc.addEventListener('pointerdown',e=>{const r=sc.getBoundingClientRect();
 const inTop=!!e.target.closest('.top')||(e.clientY-r.top<100&&($('.body')?.scrollTop||0)===0);
 dnOn=S.screen==='home'&&!!S.gest&&!S.sheet&&inTop&&!e.target.closest('input');dnX=e.clientX;dnY=e.clientY});
sc.addEventListener('pointermove',e=>{if(!dnOn)return;const dx=e.clientX-dnX,dy=e.clientY-dnY;
 if(dy>56&&dy>Math.abs(dx)*1.5){dnOn=false;clearTimeout(lpT);swAt=Date.now();go('ctrl')}});
['pointerup','pointercancel'].forEach(n=>sc.addEventListener(n,()=>{dnOn=false}));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.screen==='home'&&S.q!==null)closeSearch()});

/* drag stickers on the back */
let sd=null;
(()=>{const bk=$('#bk');
bk.addEventListener('pointerdown',e=>{
 const el=e.target.closest('.stk');
 if(!el){if(!e.target.closest('.bktray')&&S.stkSel){S.stkSel=null;document.querySelectorAll('.stk.sel').forEach(x=>x.classList.remove('sel'));updTray()}return}
 const t=S.stk.find(x=>x.id===el.dataset.id);if(!t)return;
 e.preventDefault();
 const box=$('#stks').getBoundingClientRect();
 sd={t,el,box,id:e.pointerId,ox:e.clientX-(box.left+t.x/100*box.width),oy:e.clientY-(box.top+t.y/100*box.height),mv:false};
 try{el.setPointerCapture(e.pointerId)}catch(_){}
 if(S.stkSel!==t.id){document.querySelectorAll('.stk.sel').forEach(x=>x.classList.remove('sel'));S.stkSel=t.id;el.classList.add('sel');updTray()}});
bk.addEventListener('pointermove',e=>{if(!sd||e.pointerId!==sd.id)return;const b=sd.box,
 x=Math.max(0,Math.min(100,(e.clientX-sd.ox-b.left)/b.width*100)),y=Math.max(0,Math.min(100,(e.clientY-sd.oy-b.top)/b.height*100));
 sd.t.x=+x.toFixed(1);sd.t.y=+y.toFixed(1);sd.el.style.left=sd.t.x+'%';sd.el.style.top=sd.t.y+'%';sd.mv=true});
const end=e=>{if(sd&&e.pointerId===sd.id){if(sd.mv)save();sd=null}};
bk.addEventListener('pointerup',end);bk.addEventListener('pointercancel',end)})();

(async()=>{
 await idb();const st=await get('state');
 if(st)Object.assign(S,st);S.timeout=0;
 /* 6.x -> 7.0: the metallic frames became device colours */
 if(st&&st.bezel===undefined){const f=st.frame;if(['gold','rose','blue','green'].includes(f))S.dcol=f;S.bezel=(f==='white'||f==='dark')?f:'auto'}
 S.back=false;
 if(!S.books.length){
  const lo='Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed metus nunc, semper et dolor at, tincidunt sagittis enim. Sed sollicitudin dolor id velit condimentum scelerisque. Lorem ipsum dolor sit amet, consectetur adipiscing elit. Aenean tincidunt tortor, at accumsan metus volutpat vel.';
  S.books.push({id:1,title:'Sample: Reading Paper',pages:Array.from({length:24},(_,i)=>i===0?'Welcome to Paper. Tap the right side of a page to go forward, the left side to go back, and the center for reading controls. Add your own books from the home screen. To highlight, press and hold a word, drag to select, then pick a color.\n\n'+lo:lo+'\n\n'+lo.split('. ').reverse().join('. ')),page:0,last:0,added:Date.now()});
 }
 S.screen='home';render();
})();
const refit=()=>{S.fc={};if(['read','rctrl','track'].includes(S.screen)&&book())render()};
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(refit,150)});
try{document.fonts.addEventListener('loadingdone',refit)}catch(e){}
</script><script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
