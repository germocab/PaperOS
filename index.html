<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paper e-reader 3.0</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111111">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Paper">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@700;900&family=Libre+Baskerville&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--bg:#6b6b6b;--shell:#e9e9e9;--shell2:#fff;--screen:#ececec;--ink:#111;--mut:#777;--card:#d6d6d6;--card2:#bdbdbd;--btn:#dedede;--bar:#d9d9d9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{--bg:#5f5f5f;--shell:#1d1d1d;--shell2:#2c2c2c;--screen:#f0f0f0}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);font-family:'DM Sans',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;color:var(--ink);transition:background .3s}
.device{width:min(390px,100vw - 16px);height:min(800px,100% - 16px);max-height:calc(100vh - 16px);background:var(--shell);border-radius:44px;padding:16px;box-shadow:0 0 0 2px var(--shell2),0 24px 60px #0006}
:root{--g-white:linear-gradient(135deg,#fff,#e9e9e9 55%,#d4d4d4);--g-dark:linear-gradient(135deg,#3a3a3a,#0f0f0f 60%);
--g-gold:linear-gradient(135deg,#fff3b0 0%,#e6b93a 22%,#a97c12 45%,#f7dc7a 62%,#c8961e 82%,#fbe9a0 100%);
--g-rose:linear-gradient(135deg,#ffe4dc 0%,#e8a99b 25%,#b76e79 48%,#f6cfc3 65%,#d8907f 85%,#ffe1d8 100%);
--g-blue:linear-gradient(135deg,#2c4fa3 0%,#132a66 30%,#0a1a45 55%,#1f3f8f 78%,#0c2050 100%)}
.device.f-white{background:#e9e9e9;box-shadow:0 0 0 2px #fff,0 24px 60px #0006}
.device.f-dark{background:#0f0f0f;box-shadow:0 0 0 2px #2e2e2e,0 24px 60px #000a}
.device.f-gold{background:var(--g-gold);box-shadow:0 0 0 2px #f6dc85,inset 0 2px 5px #fffa,inset 0 -2px 5px #7a560a66,0 24px 60px #0006}
.device.f-rose{background:var(--g-rose);box-shadow:0 0 0 2px #f3c2b6,inset 0 2px 5px #fffa,inset 0 -2px 5px #7a3a4466,0 24px 60px #0006}
.device.f-blue{background:var(--g-blue);box-shadow:0 0 0 2px #1c3a80,inset 0 2px 5px #8fa8e855,inset 0 -2px 5px #00000088,0 24px 60px #000a}
.screen{position:relative;width:100%;height:100%;background:var(--screen);border-radius:26px;overflow:hidden;display:flex;flex-direction:column;filter:var(--f,none);color:var(--ink)}
.screen.dark{--screen:#1b1b1b;--ink:#e8e8e8;--mut:#999;--card:#333;--card2:#4a4a4a;--btn:#2c2c2c;--bar:#2a2a2a}
.screen.warm{--screen:#efe4cc;--card:#dccdaa;--btn:#e2d5b8;--bar:#dccfae}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 8px;font-size:12px;color:var(--ink);text-align:right;line-height:1.15;flex:none}
.top b{display:block;font-size:17px;line-height:1.05;font-weight:700;letter-spacing:.01em}
.top strong{font-weight:700;display:block;line-height:1.15;margin-top:1px;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top.home .logo{width:45px;height:45px;font-size:22px;box-shadow:0 2px 0 #0003}
.logo{width:38px;height:38px;border-radius:50%;background:#111;color:#fff;border:0;font:900 19px 'Playfair Display',serif;cursor:pointer;display:grid;place-items:center}
.dark .logo{background:#eee;color:#111}
.body{flex:1;overflow:auto;padding:4px 16px 16px}
h2{font:900 26px 'Playfair Display',serif;margin:14px 0 10px}
.row{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.cover{flex:none;width:96px;height:140px;border-radius:10px;background:var(--card);border:0;padding:8px;text-align:left;font:700 12px 'Playfair Display',serif;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden}
.cover i{position:absolute;left:0;bottom:0;height:4px;background:var(--ink)}
.book{display:flex;gap:12px;width:100%;background:none;border:0;text-align:left;color:var(--ink);cursor:pointer;margin-bottom:12px;align-items:center}
.book .cv{flex:none;width:76px;height:104px;border-radius:10px;background:var(--card)}
.book>div:last-child{min-width:0;flex:1}
.book strong{font:700 15px 'Playfair Display',serif;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl{display:flex;min-width:0;max-width:100%}.ct{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cp{flex:none;white-space:nowrap}
.top .cl{justify-content:flex-end}
.sheet.ren{bottom:auto;top:64px}
.text{touch-action:pan-y}
.top .info,.top .logo,.bar button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.chl{content-visibility:auto;contain-intrinsic-size:auto 46px}
.lnk{cursor:pointer;display:flex;align-items:center;justify-content:space-between}.lnk span{color:var(--mut);font-weight:400}.lnk:active{opacity:.6}
.fl{margin:10px 0}.fl>small{display:block;font:500 11px 'DM Sans';color:var(--mut);margin-bottom:5px;text-transform:uppercase;letter-spacing:.06em}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:999px;padding:7px 13px;background:var(--btn);color:var(--ink);font:500 12px 'DM Sans',sans-serif;cursor:pointer}.chip.on{background:var(--ink);color:var(--screen)}.chip:active{transform:scale(.95)}
.sh{font:900 18px 'Playfair Display',serif;margin:16px 0 6px}
.hitb{margin-bottom:14px}.hitb strong{display:block;font:700 14px 'Playfair Display',serif}.hitb small{display:block;color:var(--mut);font-size:11px;margin-bottom:6px}
.hit{display:block;width:100%;text-align:left;background:var(--btn);border:0;border-radius:12px;padding:10px 12px;margin-bottom:6px;color:var(--ink);font:400 12px/1.5 'Libre Baskerville',Georgia,serif;cursor:pointer}
.hit i{display:block;font:500 10px 'DM Sans',sans-serif;font-style:normal;color:var(--mut);margin-bottom:2px}.hit mark{background:#ffd54a;color:#111;border-radius:3px;padding:0 1px}.hit:active{transform:scale(.97)}
.frames{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:8px 0}
.fr{background:none;border:0;color:var(--ink);font:500 10px/1.25 'DM Sans',sans-serif;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;padding:4px 0;text-align:center}
.fr.on{font-weight:700}.sw{width:42px;height:42px;border-radius:50%;display:block;box-shadow:0 0 0 1px #0003,inset 0 1px 2px #fff8}
.fr.on .sw{box-shadow:0 0 0 2px var(--screen),0 0 0 4px var(--ink)}
.sw-white{background:var(--g-white)}.sw-dark{background:var(--g-dark)}.sw-gold{background:var(--g-gold)}.sw-rose{background:var(--g-rose)}.sw-blue{background:var(--g-blue)}
.sheet input.rn{width:100%;padding:12px;border-radius:12px;border:2px solid var(--ink);background:var(--btn);color:var(--ink);font:500 15px 'DM Sans',system-ui,sans-serif;margin-bottom:10px;outline:none}.book small{color:var(--mut);font-size:12px}
.cover.has,.cv.has{background-size:cover;background-position:center;filter:grayscale(1) contrast(1.05)}
.empty{color:var(--mut);font-size:13px;padding:6px 0 10px;line-height:1.5}
.add{display:block;width:100%;padding:12px;border-radius:12px;border:1.5px dashed var(--mut);background:none;color:var(--ink);font:500 13px 'DM Sans';cursor:pointer;margin-top:4px}
.icons{display:flex;justify-content:space-between;margin:10px 0}
.ic{width:48px;height:38px;border-radius:12px;background:var(--btn);border:0;color:var(--ink);cursor:pointer;display:grid;place-items:center}
.ic.on{background:var(--ink);color:var(--screen)}
.ic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2}
.slider{width:100%;accent-color:var(--ink);margin:6px 0 12px}
.item{display:flex;width:100%;gap:10px;align-items:center;padding:12px;border-radius:12px;background:var(--btn);border:0;color:var(--ink);font:500 13px 'DM Sans';cursor:pointer;margin-bottom:8px;text-align:left}
.item span{margin-left:auto;color:var(--mut);font-size:12px}
.bar{display:flex;align-items:flex-start;justify-content:space-between;gap:2px;background:var(--bar);margin:0 10px;border-radius:24px;padding:10px 10px 8px;flex:none;box-shadow:0 8px 20px #0002,inset 0 1px 0 #ffffff55}
.bar .grp{display:flex;gap:2px}
.bar .sep{width:1px;align-self:stretch;margin:4px 3px 16px;background:var(--ink);opacity:.14;border-radius:1px}
.bar .tile{width:42px;height:42px;border-radius:15px;background:var(--btn);display:grid;place-items:center;box-shadow:inset 0 1px 0 #ffffff66,0 2px 4px #0001;transition:background-color .2s,color .2s}
.bar .tile svg{width:20px;height:20px}
.bar .tile.pl{background:var(--ink);color:var(--screen);font:900 20px 'Playfair Display',serif}
.bar .tile.on{background:var(--ink);color:var(--screen)}
.dwrap{position:relative;display:flex}
.dscrim{position:absolute;inset:0;z-index:5}
.pop{position:absolute;top:calc(100% + 10px);left:50%;transform:translateX(-50%);z-index:7;width:180px;background:var(--screen);border-radius:14px;padding:6px;box-shadow:0 8px 24px #0005,0 0 0 1px #0002;animation:fade .2s both}
.bar .pop button{flex-direction:row;justify-content:flex-start;gap:8px;min-width:0;width:100%;padding:11px 10px;border-radius:10px;background:var(--btn);font:500 13px 'DM Sans';margin:0 0 4px;text-align:left}
.bar .pop button:last-child{margin-bottom:0}
.bar .pop span{margin-left:auto;color:var(--mut);font-size:11px}
.bar button{background:none;border:0;color:var(--ink);font:500 10px 'DM Sans',system-ui,sans-serif;letter-spacing:.02em;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;min-width:50px;padding:0 2px;text-align:center;white-space:nowrap}
.text{flex:1;min-height:0;overflow:hidden;padding:8px 22px 26px;font:var(--fs,14px)/1.65 'Libre Baskerville',Georgia,serif;position:relative;cursor:pointer;white-space:pre-wrap;hyphens:auto}
.text p{margin-bottom:.9em}.text p:last-child{margin-bottom:0}
.trk{padding:14px 18px 0;flex:none}
.trk .info{cursor:pointer;text-align:center;padding:2px 6px;min-width:0}
.trk b{display:block;font-size:17px;line-height:1.05;font-weight:700}
.trk strong{display:block;font-weight:700;font-size:12px;line-height:1.15;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .info{cursor:pointer;padding:6px 4px;border-radius:10px}
.top .info:active,.trk .info:active{opacity:.6}
.trk .nav{display:flex;justify-content:space-between;align-items:flex-start;font-size:11px;text-align:center}
.trk .nav button{background:none;border:0;color:var(--ink);font:500 12px 'DM Sans';cursor:pointer;padding:4px}
.trk .ends{display:flex;justify-content:space-between;font-size:11px}
.sleep{position:absolute;inset:0;background:#000d;color:#fff;display:grid;place-items:center;font:700 22px 'Playfair Display';cursor:pointer;z-index:9}
.toast{position:absolute;bottom:64px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--screen);padding:8px 14px;border-radius:20px;font-size:12px;z-index:8}
.note{padding:10px 12px;background:var(--btn);border-radius:12px;margin-bottom:8px;font-size:12px;line-height:1.5;width:100%;border:0;text-align:left;color:var(--ink);cursor:pointer;display:block}
.note b{display:block;font-size:11px;color:var(--mut)}
.chl{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;padding:12px;border-radius:12px;background:var(--btn);border:0;color:var(--ink);font:500 13px 'DM Sans';cursor:pointer;margin-bottom:8px;text-align:left}
.chl span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chl small{flex:none;font-size:11px;color:var(--mut)}
.chl.cur{background:var(--ink);color:var(--screen)}.chl.cur small{color:inherit;opacity:.7}
.chl:active{transform:scale(.97)}
.chsub{color:var(--mut);font-size:12px;margin:-4px 0 12px}
.back{font:500 12px 'DM Sans';background:none;border:0;color:var(--ink);cursor:pointer;padding:4px 0}
/* full view */
.device{transition:padding .4s cubic-bezier(.2,.8,.2,1),border-radius .4s,width .4s cubic-bezier(.2,.8,.2,1),height .4s cubic-bezier(.2,.8,.2,1),background-color .35s}
.device.full{width:100vw;height:100%;max-height:none;padding:0;border-radius:0;background:transparent;box-shadow:none}
.full .screen{border-radius:0}
.full .top,.full .text,.full .body,.full .trk{width:100%;max-width:760px;margin-left:auto;margin-right:auto}
.full .bar{max-width:740px;width:calc(100% - 20px);margin:0 auto}
/* finish */
.fin{position:relative;flex:1;overflow-x:hidden;overflow-y:auto;color:var(--ink);background:radial-gradient(120% 90% at 50% 30%,color-mix(in srgb,var(--ink) 8%,var(--screen)) 0%,var(--screen) 72%);display:flex;flex-direction:column;align-items:center;justify-content:safe center;padding:20px 22px;text-align:center}
.rays{position:absolute;left:50%;top:30%;width:190%;aspect-ratio:1;translate:-50% -50%;pointer-events:none;background:repeating-conic-gradient(color-mix(in srgb,var(--ink) 9%,transparent) 0 6deg,transparent 6deg 15deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 62%);mask:radial-gradient(circle,#000 0,transparent 62%);animation:spin 50s linear infinite,fade 1.4s ease-out .9s both}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;animation:flash .9s ease-out 1.2s forwards}
.stage{position:relative;width:min(40%,150px);aspect-ratio:2/3;margin:6px 0 22px;perspective:900px;flex:none}
.cwrap{position:absolute;inset:0;border-radius:8px 14px 14px 8px;box-shadow:0 0 0 1px #00000018,0 24px 50px #0005,0 6px 12px #0003;animation:coverin 1.3s cubic-bezier(.16,1.05,.3,1) .15s both,float 4.5s ease-in-out 1.6s infinite}
.fc{position:absolute;inset:0;border-radius:inherit;background:#d8d8d8 center/cover;filter:grayscale(1) contrast(1.05);display:grid;place-items:center;color:#111;font:700 15px 'Playfair Display',serif;padding:12px}
.ring{position:absolute;left:50%;top:50%;width:100%;aspect-ratio:1;border-radius:50%;border:1.5px solid var(--ink);translate:-50% -50%;opacity:0;animation:ring 1.3s ease-out forwards}
.pc{position:absolute;left:50%;top:50%;border-radius:2px;opacity:0;animation:burst 1.6s cubic-bezier(.1,.8,.2,1) 1.2s forwards}
.conf{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.pf{position:absolute;top:-24px;border-radius:2px;opacity:0;animation:fall 3s linear forwards}
.end{font:italic 400 clamp(40px,13vw,58px)/1.05 'Libre Baskerville',Georgia,serif;letter-spacing:-.01em;display:flex;justify-content:center;flex-wrap:wrap;color:var(--ink);margin-bottom:12px}
.end span{display:inline-block;animation:lt .7s cubic-bezier(.2,.8,.2,1) calc(1.1s + var(--i,0)*80ms) both}
.end .sp{width:.28em}
.ft{font-size:14px;opacity:.9;margin-bottom:18px;animation:rise .6s ease-out 1.8s both;max-width:290px}
.ft strong{font:700 15px 'Playfair Display',serif}
.stats{display:flex;gap:12px;margin-bottom:22px}
.st{background:var(--btn);border:0;border-radius:18px;padding:12px 16px;min-width:120px;animation:pop .7s cubic-bezier(.2,1.5,.4,1) 1.6s both}
.st:nth-child(2){animation-delay:1.85s}
.st b{display:block;font:900 34px/1.05 'Playfair Display',serif;color:var(--ink)}
.st b small{font:500 13px 'DM Sans',sans-serif;color:var(--ink);margin:0 4px 0 2px}
.st span{font-size:11px;opacity:.8}
.acts{display:flex;flex-direction:column;gap:10px;width:min(260px,100%);animation:rise .6s ease-out 2.4s both}
.fb{padding:13px;border-radius:14px;border:2px solid var(--ink);background:none;color:var(--ink);font:700 14px 'DM Sans',sans-serif;cursor:pointer;transition:transform .18s}
.fb:active{transform:scale(.95)}
.fb.main{background:var(--ink);color:var(--screen)}
@keyframes spin{to{rotate:360deg}}
@keyframes flash{from{opacity:.85}to{opacity:0}}
@keyframes coverin{from{opacity:0;transform:translateY(130%) rotateY(-600deg) rotate(-20deg) scale(.3)}55%{opacity:1}to{opacity:1;transform:none}}
@keyframes float{50%{transform:translateY(-8px) rotate(.6deg)}}
@keyframes ring{from{opacity:.4;scale:.6}to{opacity:0;scale:3.2}}
@keyframes burst{0%{opacity:1;transform:translate(-50%,-50%) scale(.2)}70%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--r)) scale(1)}}
@keyframes fall{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:.9;transform:translate(var(--sw),900px) rotate(720deg)}}
@keyframes lt{from{opacity:0;transform:translateY(30px);filter:blur(6px)}}
@keyframes pop{from{opacity:0;transform:scale(.4) translateY(20px)}}
@media (max-height:700px){.stage{width:104px;margin-bottom:14px}.end{font-size:48px}}
.noanim .conf,.noanim .rays,.noanim .flash,.noanim .ring,.noanim .burst{display:none}
/* search, gestures, delete */
.screen{touch-action:pan-y}.row{touch-action:pan-x pan-y}
.sbar{display:flex;gap:8px;align-items:center;margin:10px 0 6px;animation:bar .35s cubic-bezier(.2,.9,.2,1) both}
.sbar input{flex:1;min-width:0;background:var(--btn);border:0;border-radius:12px;padding:12px 14px;font:500 14px 'DM Sans',sans-serif;color:var(--ink);-webkit-appearance:none;appearance:none}
.sbar input::placeholder{color:var(--mut)}
.sbar button{background:none;border:0;color:var(--ink);font:500 13px 'DM Sans',sans-serif;cursor:pointer;padding:8px 2px}
.shard{position:absolute;z-index:9;pointer-events:none;filter:grayscale(1);outline:1px solid #0003;animation:shard .85s cubic-bezier(.15,.7,.3,1) forwards}
.puff{position:absolute;z-index:8;border-radius:50%;translate:-50% -50%;background:radial-gradient(circle,var(--ink) 0,transparent 65%);opacity:0;pointer-events:none;animation:puff .7s ease-out forwards}
@keyframes shard{0%{opacity:1;transform:translate(0,0) rotate(0) scale(1)}55%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(.2)}}
@keyframes puff{from{opacity:.45;scale:.2}to{opacity:0;scale:1.8}}
.cc .cover.has,.cc .cv.has,.cc .fc,.cc .shard{filter:none}
/* motion */
.screen{transition:background-color .35s,filter .3s}
.item,.ic,.cover,.book,.note,.logo,.bar button,.add{transition:transform .18s cubic-bezier(.2,.8,.2,1),background-color .3s,color .3s}
.item:active,.chl:active,.ic:active,.cover:active,.book:active,.note:active,.logo:active,.bar button:active,.add:active{transform:scale(.95)}
[data-bid]{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
@keyframes zoom{from{opacity:0;transform:scale(.94)}}
@keyframes drop{from{opacity:0;transform:translateY(-22px)}}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes bar{from{opacity:0;transform:translateY(-16px)}}
@keyframes tn{from{opacity:0;transform:translateX(var(--tx))}}
@keyframes up{from{transform:translateY(110%)}}
@keyframes out{to{transform:translateY(110%)}}
@keyframes fout{to{opacity:0}}
.enter-zoom>*{animation:zoom .5s cubic-bezier(.2,.8,.2,1) both}
.enter-drop>*{animation:drop .45s cubic-bezier(.2,.8,.2,1) both}
.enter-fade>*{animation:fade .35s both}
.stag .body>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*45ms + 60ms)}
.drop-in{animation:bar .4s cubic-bezier(.2,.9,.2,1) both}
.turn-next{--tx:26px;animation:tn .32s cubic-bezier(.2,.8,.2,1) both}
.turn-prev{--tx:-26px;animation:tn .32s cubic-bezier(.2,.8,.2,1) both}
.scrim{position:absolute;inset:0;background:#0006;z-index:7}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;background:var(--screen);border-radius:22px;padding:16px 14px 8px;z-index:8;box-shadow:0 -10px 30px #0004}
.sheet h3{font:900 18px 'Playfair Display',serif;margin-bottom:2px}
.sheet small{display:block;color:var(--mut);font-size:12px;margin-bottom:12px}
.item.danger{background:var(--ink);color:var(--screen)}
.scrim.in{animation:fade .25s both}.sheet.in{animation:up .38s cubic-bezier(.2,.9,.2,1) both}
.sheet.out{animation:out .2s ease-in both}.scrim.out{animation:fout .2s both}
.noanim,.noanim *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){.device,.device *{animation:none!important;transition:none!important}}

</style></head><body>
<div class="device"><div class="screen" id="scr"></div></div>

<script>
const $=s=>document.querySelector(s);
const S={books:[],cur:null,screen:'home',night:false,dark:false,size:14,timeout:0,notes:[],bright:100,anim:true,full:false,gest:true,ccolor:false,q:null,ctrlFrom:'home',sheet:null,confirm:null,shown:null};
const I={wifi:'<svg viewBox="0 0 24 24"><path d="M2 9a15 15 0 0 1 20 0M5 13a10 10 0 0 1 14 0M8.5 16.5a5 5 0 0 1 7 0"/></svg>',
shot:'<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 15l5-5 4 4 3-3 4 4"/></svg>',

clock:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>',

search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>',
edit:'<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4zM13 7l4 4"/></svg>',
trash:'<svg viewBox="0 0 24 24"><path d="M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13"/></svg>'};
const ico=(k,c='')=>`<span class="ic ${c}" style="width:auto;height:auto;background:none">${I[k]}</span>`.replace('class="ic ','class="ic-s ');
const svg=k=>I[k].replace('<svg','<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"');

/* storage (IndexedDB, guarded) */
let db;
function idb(){return new Promise(r=>{try{const q=indexedDB.open('paper',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>r()}catch(e){r()}})}
const get=k=>new Promise(r=>{if(!db)return r();try{const q=db.transaction('k').objectStore('k').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()}catch(e){r()}});
const put=(k,v)=>{try{db&&db.transaction('k','readwrite').objectStore('k').put(v,k)}catch(e){}};
const save=()=>put('state',{books:S.books,cur:S.cur,night:S.night,dark:S.dark,size:S.size,timeout:S.timeout,notes:S.notes,bright:S.bright,anim:S.anim,full:S.full,gest:S.gest,ccolor:S.ccolor,frame:S.frame,bsort:S.bsort,bfilter:S.bfilter,btype:S.btype});

/* pagination */
function paginate(text){
 const paras=text.replace(/\r/g,'').split(/\n{2,}|\n(?=\s)/).map(p=>p.replace(/\s+/g,' ').trim()).filter(Boolean);
 const pages=[];let cur='';
 for(const p of paras){ if((cur+p).length>1100&&cur){pages.push(cur);cur=''} cur+=(cur?'\n\n':'')+p; while(cur.length>1500){pages.push(cur.slice(0,1300));cur=cur.slice(1300)} }
 if(cur)pages.push(cur); return pages.length?pages:['(No readable text found in this file.)'];
}
const shrink=url=>new Promise(r=>{const i=new Image();i.onload=()=>{const w=240,h=Math.round(i.height*w/i.width),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(i,0,0,w,h);r(c.toDataURL('image/jpeg',.8))};i.onerror=()=>r(null);i.src=url});
async function readEpub(f){
 const z=await JSZip.loadAsync(await f.arrayBuffer());
 const opf=Object.keys(z.files).find(n=>n.endsWith('.opf'));
 const x=new DOMParser().parseFromString(await z.file(opf).async('string'),'application/xml');
 const base=opf.includes('/')?opf.slice(0,opf.lastIndexOf('/')+1):'';
 const man={};x.querySelectorAll('manifest > item').forEach(i=>man[i.getAttribute('id')]=i.getAttribute('href'));
 const title=x.querySelector('metadata > *|title,title')?.textContent||f.name;
 let cover=null;
 try{const its=[...x.querySelectorAll('manifest > item')],cid=x.querySelector('meta[name="cover"]')?.getAttribute('content');
  const it=its.find(i=>(i.getAttribute('properties')||'').includes('cover-image'))||its.find(i=>i.getAttribute('id')===cid&&/image/.test(i.getAttribute('media-type')))||its.find(i=>/cover/i.test(i.getAttribute('id')+i.getAttribute('href'))&&/image/.test(i.getAttribute('media-type')));
  if(it){const b64=await z.file(decodeURIComponent(base+it.getAttribute('href'))).async('base64');cover=await shrink('data:'+it.getAttribute('media-type')+';base64,'+b64)}}catch(e){}
 let out='';const docs=[];
 for(const r of x.querySelectorAll('spine > itemref')){
  const h=man[r.getAttribute('idref')];const zf=z.file(decodeURIComponent(base+h));if(!zf)continue;
  const d=new DOMParser().parseFromString(await zf.async('string'),'text/html');
  d.querySelectorAll('script,style').forEach(e=>e.remove());
  const hd=d.body.querySelector('h1,h2,h3')?.textContent.replace(/\s+/g,' ').trim().slice(0,40);
  d.body.querySelectorAll('p,h1,h2,h3,h4,li,div,br').forEach(e=>e.append('\n\n'));
  const tx=d.body.textContent;out+=tx+'\n\n';docs.push({t:hd,tx});
 }
 const pgs=[],ch=[];for(const d of docs){if(d.tx.trim().length<150)continue;ch.push({t:d.t||('Chapter '+(ch.length+1)),s:pgs.length});pgs.push(...paginate(d.tx))}
 return{title,text:out,cover,pages:pgs.length?pgs:null,ch:ch.length>1?ch:null};
}
async function readPdf(f){
 pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
 const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let out='';
 let cover=null;
 try{const pg=await pdf.getPage(1),vp=pg.getViewport({scale:1}),c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;cover=await shrink(c.toDataURL('image/jpeg',.8))}catch(e){}
 for(let i=1;i<=pdf.numPages;i++){const c=await(await pdf.getPage(i)).getTextContent();out+=c.items.map(t=>t.str+(t.hasEOL?'\n':' ')).join('')+'\n\n'}
 return{title:f.name.replace(/\.pdf$/i,''),text:out,cover};
}
async function importFiles(files){
 toast('Adding books…');
 for(const f of files){
  try{
   const n=f.name.toLowerCase();
   const r=n.endsWith('.epub')?await readEpub(f):n.endsWith('.pdf')?await readPdf(f):{title:f.name.replace(/\.\w+$/,''),text:await f.text()};
   S.books.push({id:Date.now()+Math.random(),title:r.title.trim().slice(0,60),file:f.name,pages:r.pages||paginate(r.text),ch:r.ch||null,cover:r.cover||null,page:0,added:Date.now(),last:0});
  }catch(e){toast('Couldn’t open '+f.name)}
 }
 save();go('home');
}

/* helpers */
const book=()=>S.books.find(b=>b.id===S.cur);
const clock=()=>new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',hour12:false});
const date=()=>new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
let tt;function toast(m){clearTimeout(tt);let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';$('#scr').append(t)}t.textContent=m;tt=setTimeout(()=>t.remove(),1600)}
function go(s){
 S.dmenu=false;
 if(s==='text')S.setFrom=S.screen==='rctrl'?'rctrl':'ctrl';
 if(s!=='home')S.q=null;
 if(s==='ctrl'){if(['read','rctrl','track'].includes(S.screen)&&book())S.ctrlFrom='read';else if(S.screen==='home')S.ctrlFrom='home';else if(S.screen==='books')S.ctrlFrom='books'}
 S.screen=s;render()}
function openBook(id){S.sheet=null;S.confirm=null;S.cur=id;const b=book();b.last=Date.now();save();go('read')}
function openStart(id){const b=S.books.find(x=>x.id===id);if(b)b.page=0;openBook(id)}
function openSheet(id){S.sheet=id;S.confirm=null;S.rename=null;S.sheetIn=true;render();S.sheetIn=false}
function closeSheet(){const done=()=>{S.sheet=null;S.confirm=null;S.rename=null;render()};const sh=$('.sheet');
 if(S.anim&&sh){sh.classList.add('out');$('.scrim')?.classList.add('out');setTimeout(done,200)}else done()}
function delBook(id){if(S.confirm!==id){S.confirm=id;render();return}
 const kill=()=>{S.books=S.books.filter(b=>b.id!==id);S.notes=S.notes.filter(n=>n.b!==id);if(S.cur===id)S.cur=null;save();render()};
 S.sheet=null;S.confirm=null;render();
 const els=S.anim?[...document.querySelectorAll('#scr [data-bid]')].filter(e=>Number(e.dataset.bid)===id):[];
 if(!els.length)return kill();
 els.forEach(explode);try{navigator.vibrate&&navigator.vibrate([25,30,45])}catch(e){}
 setTimeout(kill,900)}
function explode(el){const sc=$('#scr'),o=sc.getBoundingClientRect();
 let t=el;if(el.classList.contains('book')){t=el.querySelector('.cv');el.lastElementChild.style.transition='opacity .2s';el.lastElementChild.style.opacity=0}
 const r=t.getBoundingClientRect(),cs=getComputedStyle(t),img=cs.backgroundImage,col=cs.backgroundColor;
 const C=6,N=8,W=r.width/C,H=r.height/N,cx=r.left-o.left+r.width/2,cy=r.top-o.top+r.height/2;
 let h=`<i class="puff" style="left:${cx}px;top:${cy}px;width:${r.width*1.5}px;height:${r.width*1.5}px"></i>`;
 for(let i=0;i<N;i++)for(let j=0;j<C;j++){const x=r.left-o.left+j*W,y=r.top-o.top+i*H,ang=Math.atan2(y+H/2-cy,x+W/2-cx)+(Math.random()-.5)*.8,d=60+Math.random()*130;
  h+=`<i class="shard" style="left:${x}px;top:${y}px;width:${W+.5}px;height:${H+.5}px;background:${img!=='none'?img:'var(--card2)'};background-size:${r.width}px ${r.height}px;background-position:${-j*W}px ${-i*H}px;--dx:${Math.cos(ang)*d|0}px;--dy:${Math.sin(ang)*d-20|0}px;--r:${Math.random()*540-270|0}deg;animation-delay:${Math.random()*70|0}ms"></i>`}
 sc.insertAdjacentHTML('beforeend',h);t.style.visibility='hidden';
 try{sc.animate([{transform:'translate(0,0)'},{transform:'translate(-3px,2px)'},{transform:'translate(3px,-2px)'},{transform:'translate(0,0)'}],{duration:180,delay:40})}catch(e){}}
function renameOpen(id){S.rename=id;S.confirm=null;render();setTimeout(()=>{const i=$('#rn');if(i){i.focus();i.select()}},40)}
function renameSave(id){const b=S.books.find(x=>x.id===id),i=$('#rn');if(!b||!i)return;const v=i.value.replace(/\s+/g,' ').trim().slice(0,120);
 if(!v)return toast('Title can\'t be empty');b.title=v;S.rename=null;S.sheet=null;save();render();toast('Book renamed')}
function sheet(){const b=S.books.find(x=>x.id===S.sheet);if(!b)return'';const c=S.sheetIn?' in':'';
 if(S.rename===b.id)return `<div class="scrim${c}" onclick="closeSheet()"></div><div class="sheet ren" role="dialog" aria-label="Rename book"><h3>Rename book</h3><small>Give it a title you'll recognize.</small>
 <input class="rn" id="rn" type="text" maxlength="120" value="${esc(b.title)}" aria-label="Book title" autocomplete="off" onkeydown="if(event.key==='Enter')renameSave(${b.id});if(event.key==='Escape')closeSheet()">
 <button class="item" style="background:var(--ink);color:var(--screen)" onclick="renameSave(${b.id})">${svg('edit')} Save title</button>
 <button class="item" onclick="closeSheet()">Cancel</button></div>`;
 return `<div class="scrim${c}" onclick="closeSheet()"></div><div class="sheet${c}" role="dialog" aria-label="Book options"><h3>${esc(b.title)}</h3><small>${chInfo(b,`Page ${b.page+1} of ${b.pages.length}`)}</small>
 <button class="item" onclick="openBook(${b.id})">${svg('lib')} Continue from page ${b.page+1}</button>
 <button class="item" onclick="openStart(${b.id})">${svg('save')} Open from the beginning</button>
 <button class="item" onclick="renameOpen(${b.id})">${svg('edit')} Rename book</button>
 <button class="item danger" onclick="delBook(${b.id})">${svg('trash')} ${S.confirm===b.id?'Tap again to delete for good':'Delete book'}</button>
 <button class="item" onclick="closeSheet()">Cancel</button></div>`}
const chInfo=(b,tail)=>`<span class="cl"><span class="ct">${chapter(b)}</span><span class="cp">&nbsp;· ${tail}</span></span>`;
const chapter=b=>{if(b.ch&&b.ch.length){let c=b.ch[0];for(const x of b.ch)if(x.s<=b.page)c=x;return esc(c.t)}return 'Chapter '+(Math.floor(b.page/10)+1)};
function hdr(left,right1,right2,tap,o){o=o||{};return `<div class="top ${right1==='PaperHome'?'home':''}"><button class="logo" onclick="${left}" aria-label="Paper Controls"${o.lp?` data-lp="${o.lp}"`:''}>P</button><div ${tap?`class="info" role="button" tabindex="0" aria-label="${o.label||'Open reading tracker'}" onclick="${tap}"${o.ilp?` data-lp="${o.ilp}"`:''}`:''}><b>${clock()}</b><strong>${right1}</strong>${right2?`<strong>${right2}</strong>`:''}</div></div>`}
const cvStyle=b=>b.cover?`style="background-image:url(${b.cover})"`:'';
function coverBtn(b){const pr=Math.round(b.page/Math.max(1,b.pages.length-1)*100);return `<button data-bid="${b.id}" class="cover ${b.cover?'has':''}" ${cvStyle(b)} aria-label="${esc(b.title)}" onclick="openBook(${b.id})">${b.cover?'':esc(b.title)}<i style="width:${pr}%"></i></button>`}

/* screens */
const bookRow=b=>`<button class="book" data-bid="${b.id}" onclick="openBook(${b.id})"><div class="cv ${b.cover?'has':''}" ${cvStyle(b)}></div><div><strong>${esc(b.title)}</strong><small>${chInfo(b,`Page ${b.page+1} of ${b.pages.length}`)}</small></div></button>`;
const findBooks=q=>S.books.filter(b=>!q||((b.title||'')+' '+(b.file||'')).toLowerCase().includes(q));
const snip=(t,o,n)=>{const a=Math.max(0,o-38),e=Math.min(t.length,o+n+72),c=x=>esc(x.replace(/\s+/g,' '));return(a?'…':'')+c(t.slice(a,o))+'<mark>'+c(t.slice(o,o+n))+'</mark>'+c(t.slice(o+n,e))+(e<t.length?'…':'')};
function contentHits(q){const out=[];
 for(const b of S.books){let n=0;const hits=[];
  for(let i=0;i<b.pages.length&&n<500;i++){const lc=b.pages[i].toLowerCase();let at=lc.indexOf(q);
   while(at>-1&&n<500){n++;if(hits.length<3)hits.push({p:i,o:at});at=lc.indexOf(q,at+q.length)}}
  if(n)out.push({b,n,hits});if(out.length>=25)break}
 return out}
function searchHTML(raw){const q=raw.trim().toLowerCase(),tl=findBooks(q);let h='';
 if(tl.length)h+=`<p class="empty">${tl.length} ${tl.length===1?'book':'books'}</p>`+tl.map(bookRow).join('');
 if(q.length>=2){const ch=contentHits(q);
  if(ch.length)h+=`<h3 class="sh">Inside your books</h3>`+ch.map(x=>`<div class="hitb"><strong>${esc(x.b.title)}</strong><small>${x.n>=500?'500+':x.n} ${x.n===1?'match':'matches'}</small>${x.hits.map(k=>`<button class="hit" onclick="openHit(${x.b.id},${k.p},${k.o})"><i>Page ${k.p+1}</i>${snip(x.b.pages[k.p],k.o,q.length)}</button>`).join('')}</div>`).join('');
  else if(!tl.length)h+=`<p class="empty">Nothing matches “${esc(raw.trim())}”.</p>`}
 else if(q&&!tl.length)h+=`<p class="empty">No titles match. Type 2 or more letters to search inside your books.</p>`;
 return h}
function openHit(id,p,o){const b=S.books.find(x=>x.id===id);if(!b)return;S.q=null;S.sheet=null;S.cur=id;b.page=p;S.jumpOff=o;b.last=Date.now();save();go('read')}
function openSearchHome(){S.q='';go('home');setTimeout(()=>$('#q')?.focus(),60)}
function openSearch(){S.q='';render();setTimeout(()=>$('#q')?.focus(),40)}
function closeSearch(){S.q=null;render()}
let qT;function onQ(v){S.q=v;clearTimeout(qT);qT=setTimeout(()=>{const r=$('#res');if(r&&S.q===v)r.innerHTML=searchHTML(v)},v.trim().length>=2?220:0)}
function home(){
 const tap="S.q===null?openSearch():closeSearch()";
 if(S.q!==null){const q=S.q.trim().toLowerCase();
  return hdr("go('ctrl')",'PaperHome',null,tap)+`<div class="body"><div class="sbar"><input id="q" type="search" placeholder="Search titles and text in your books" value="${esc(S.q)}" oninput="onQ(this.value)" aria-label="Search titles and inside your books" autocomplete="off"><button onclick="closeSearch()">Cancel</button></div><div id="res">${searchHTML(S.q)}</div></div>`}
 const rec=[...S.books].filter(b=>b.last).sort((a,b)=>b.last-a.last).slice(0,6);
 return hdr("go('ctrl')",'PaperHome',null,tap)+`<div class="body"><h2>Resume</h2>
 ${rec.length?`<div class="row">${rec.map(coverBtn).join('')}</div>`:'<p class="empty">Books you start reading show up here.</p>'}
 <h2 class="lnk" role="button" tabindex="0" onclick="go('books')" aria-label="Open Your Books page">Your Books <span aria-hidden="true">›</span></h2>
 ${S.books.map(bookRow).join('')}${S.books.length?'':'<p class="empty">No books yet. Open Paper Controls and choose Upload to add EPUB, PDF or TXT files.</p>'}</div>`;
}
const SORTS=[['recent','Recently read'],['added','Recently added'],['title','Title A–Z'],['progress','Progress']],FILTS=[['all','All'],['reading','Reading'],['new','Not started'],['done','Finished']],TYPES=[['all','Any format'],['epub','EPUB'],['pdf','PDF'],['txt','TXT']];
const bkExt=b=>((b.file||'').split('.').pop()||'').toLowerCase(),bkPct=b=>b.done?1:b.page/Math.max(1,b.pages.length-1);
function setBk(k,v){S[k]=v;save();render()}
function resetBk(){S.bfilter='all';S.btype='all';save();render()}
function books(){
 const so=S.bsort||'recent',fi=S.bfilter||'all',ty=S.btype||'all';
 const l=S.books.filter(b=>(fi==='all'||(fi==='done'?!!b.done:fi==='reading'?(!b.done&&b.page>0):(!b.done&&b.page===0)))&&(ty==='all'||bkExt(b)===ty));
 l.sort({recent:(a,b)=>(b.last||0)-(a.last||0),added:(a,b)=>(b.added||0)-(a.added||0),title:(a,b)=>(a.title||'').localeCompare(b.title||'',undefined,{sensitivity:'base',numeric:true}),progress:(a,b)=>bkPct(b)-bkPct(a)}[so]);
 const chips=(key,opts,cur)=>opts.map(([v,n])=>`<button class="chip${v===cur?' on':''}" aria-pressed="${v===cur}" onclick="setBk('${key}','${v}')">${n}</button>`).join('');
 return hdr("go('ctrl')",'Your Books')+`<div class="body"><h2>Your Books</h2><p class="chsub">${l.length===S.books.length?`${l.length} ${l.length===1?'book':'books'}`:`${l.length} of ${S.books.length} books`}</p>
 <div class="fl"><small>Sort by</small><div class="chips">${chips('bsort',SORTS,so)}</div></div>
 <div class="fl"><small>Status</small><div class="chips">${chips('bfilter',FILTS,fi)}</div></div>
 <div class="fl"><small>Format</small><div class="chips">${chips('btype',TYPES,ty)}</div></div>
 <div style="margin-top:12px">${l.length?l.map(bookRow).join(''):`<p class="empty">No books match these filters.</p><button class="item" onclick="resetBk()">Clear filters</button>`}</div></div>`}
function ctrl(){
 const inBook=!!book();
 return `<div class="top"><button class="logo" onclick="go(S.ctrlFrom==='read'&&book()?'read':S.ctrlFrom==='books'?'books':'home')" aria-label="Close controls">P</button><div><b>${clock()}</b>${date()}<strong>PaperControls</strong></div></div>
 <div class="body"><div class="icons">
 <button class="ic ${S.full?'on':''}" aria-label="Full View" title="Full View" onclick="toggleFull()">${svg('full')}</button>
 <button class="ic ${S.gest?'on':''}" aria-label="Gestures" title="Gestures" onclick="toggleGest()">${svg('gest')}</button>
 <button class="ic ${S.dark?'on':''}" aria-label="Dark mode" onclick="tog('dark')">${svg('dark')}</button>
 <button class="ic" aria-label="Settings" title="Settings" onclick="go('text')">${svg('sett')}</button></div>
 <input class="slider" type="range" min="40" max="100" value="${S.bright}" aria-label="Brightness" oninput="S.bright=this.value;bright();save()">
 <button class="item" onclick="go('home')">${svg('lib')} Library</button>
 <button class="item" onclick="go('notes')">${svg('notes')} Bookmark <span>${S.notes.length}</span></button>
 <button class="item" onclick="$('#file').click()">${svg('upload')} Upload <span>EPUB, PDF, TXT</span></button>
 <button class="item" onclick="openSearchHome()">${svg('search')} Search <span>Titles & text</span></button>
 <h2>Quick Peek</h2>
 ${S.books.length?`<div class="row">${S.books.map(coverBtn).join('')}</div>`:'<p class="empty">Add books to jump between them here.</p>'}</div>`;
}
const hasCh=b=>!!(b&&b.ch&&b.ch.length>1);
function openInfo(){go(hasCh(book())?'chapters':'track')}
function read(){
 const b=book();if(!b)return go('home'),'';
 return hdr("go('rctrl')",esc(b.title),chInfo(b,`Page ${b.page+1}`),"openInfo()",{lp:'ctrl',ilp:'track',label:hasCh(b)?'Chapters (hold for reading tracker)':'Reading tracker'})+`<div class="text" id="txt" style="--fs:${S.size}px" onclick="tap(event)" aria-label="Book page">${b.pages[b.page].split('\n\n').map(p=>`<p>${esc(p)}</p>`).join('')}</div>`;
}
function rctrl(){
 const b=book();
 return `${S.dmenu?'<div class="dscrim" onclick="toggleDmenu()"></div>':''}<div style="padding:12px 0 6px;flex:none;position:relative;z-index:6"><div class="bar" role="toolbar" aria-label="Reading controls">
 <div class="grp"><button onclick="go('ctrl')" aria-label="Paper Controls"><span class="tile pl">P</span>Controls</button>
 <button onclick="go('home')"><span class="tile">${svg('lib')}</span>Library</button></div>
 <i class="sep"></i>
 <div class="grp"><div class="dwrap"><button onclick="toggleDmenu()" aria-haspopup="true" aria-expanded="${!!S.dmenu}"><span class="tile${S.dmenu?' on':''}">${svg('disp')}</span>Display</button>
  ${S.dmenu?`<div class="pop" role="menu"><button role="menuitem" onclick="tog('night')">${svg('night')} Night mode <span>${S.night?'On':'Off'}</span></button><button role="menuitem" onclick="tog('dark')">${svg('eye')} Dark mode <span>${S.dark?'On':'Off'}</span></button></div>`:''}</div>
 <button onclick="go('text')"><span class="tile">${svg('sett')}</span>Settings</button></div>
 <i class="sep"></i>
 <div class="grp"><button onclick="savePage()"><span class="tile">${svg('save')}</span>Save Page</button></div></div></div>
 <div class="text" style="--fs:${S.size}px" onclick="go('read')">${b.pages[b.page].split('\n\n').map(p=>`<p>${esc(p)}</p>`).join('')}</div>`;
}
function chapters(){
 const b=book();if(!b)return go('home'),'';
 if(!hasCh(b))return go('track'),'';
 let ci=0;b.ch.forEach((c,i)=>{if(c.s<=b.page)ci=i});
 return `<div class="top"><button class="logo" onclick="go('read')" aria-label="Back to the page">P</button><div class="info" role="button" tabindex="0" aria-label="Back to the page" onclick="go('read')"><b>${clock()}</b><strong>${esc(b.title)}</strong><strong>${chInfo(b,`Page ${b.page+1}`)}</strong></div></div>
 <div class="body" id="chb"><h2>Chapters</h2><p class="chsub">${b.ch.length} chapters · tap one to jump there</p>
 ${b.ch.map((c,i)=>`<button class="chl${i===ci?' cur':''}" ${i===ci?'id="chcur" aria-current="true"':''} onclick="goCh(${i})"><span>${esc(c.t)}</span><small>p. ${c.s+1}</small></button>`).join('')}
 <button class="item" style="margin-top:8px" onclick="go('track')">Reading tracker</button></div>`;
}
function goCh(i){const b=book();if(!b||!b.ch[i])return;b.page=Math.max(0,Math.min(b.pages.length-1,b.ch[i].s));b.last=Date.now();save();go('read')}
/* fit text inside the visible area: split a stored page into sub-pages that never overflow */
const htmlOf=t=>t.split('\n\n').map(p=>`<p>${esc(p)}</p>`).join('');
function fitText(el,b,idx){
 const src=b.pages[b.page],key=`${b.id}|${b.page}|${S.size}|${el.clientWidth}x${el.clientHeight}`;
 S.fc=S.fc||{};let subs=S.fc[key];
 if(!subs){
  const paint=t=>{el.innerHTML=htmlOf(t)},fits=()=>el.scrollHeight<=el.clientHeight+1;
  paint(src);
  if(!el.clientHeight||fits())subs=[src];
  else{
   const tk=[];src.split('\n\n').forEach(p=>p.split(/\s+/).filter(Boolean).forEach((w,i)=>tk.push({w,pb:i===0&&tk.length>0})));
   const mk=(i,j)=>{let o='';for(let k=i;k<j;k++)o+=(k===i?'':tk[k].pb?'\n\n':' ')+tk[k].w;return o};
   subs=[];let i=0;
   while(i<tk.length){
    let lo=1,hi=tk.length-i;paint(mk(i,i+hi));
    if(fits()){subs.push(mk(i,tk.length));break}
    while(lo<hi){const m=(lo+hi+1)>>1;paint(mk(i,i+m));if(fits())lo=m;else hi=m-1}
    subs.push(mk(i,i+lo));i+=lo}
   if(!subs.length)subs=[src]}
  if(Object.keys(S.fc).length>300)S.fc={};
  S.fc[key]=subs}
 const k=Math.max(0,Math.min(idx,subs.length-1));
 el.innerHTML=htmlOf(subs[k]);
 return{subs,idx:k}}
function layoutText(cur,b){
 const el=$('.text');if(!el)return;
 const key=b.id+'|'+b.page;
 if(S.spK!==key){S.spK=key;S.sp=b.spP===b.page?(b.sp||0):0}
 if(S.jumpOff!=null&&cur==='read'){const r0=fitText(el,b,0);let acc=0,k=0;for(let i=0;i<r0.subs.length;i++){k=i;acc+=r0.subs[i].length+1;if(S.jumpOff<acc)break}S.sp=k;S.jumpOff=null}
 if(cur==='track'){fitText(el,b,0);return}
 const tag=key+'|'+S.size+'|'+S.sp;
 if(cur==='rctrl'&&S.subTxt&&S.subFor===tag){el.innerHTML=htmlOf(S.subTxt);return}
 const r=fitText(el,b,S.sp);
 S.sp=r.idx;S.nsub=r.subs.length;S.subTxt=r.subs[r.idx];S.subFor=key+'|'+S.size+'|'+S.sp;b.sp=r.idx;b.spP=b.page}
function track(){
 const b=book(),last=b.pages.length;
 return `<div class="trk"><div class="nav"><button onclick="jump(-1)">Previous<br>Chapter</button><div class="info" role="button" tabindex="0" aria-label="Back to the page" onclick="go('read')"><b>${clock()}</b><strong>${esc(b.title)}</strong><strong id="lbl">${chInfo(b,`Page ${b.page+1}`)}</strong></div><button onclick="jump(1)">Next<br>Chapter</button></div>
 <input class="slider" type="range" min="1" max="${last}" value="${b.page+1}" aria-label="Page" oninput="scrub(this.value)">
 <div class="ends"><span>1</span><span>${last}</span></div></div>
 <div class="text" id="tp" style="--fs:${S.size}px" onclick="go('read')">${pg()}</div>`;
}
function done(){
 const b=book();if(!b)return go('home'),'';
 const cols=[92,70,50,34,20].map(n=>`color-mix(in srgb,var(--ink) ${n}%,transparent)`),R=Math.random;
 let burst='',fall='';
 for(let i=0;i<54;i++){const a=R()*6.283,d=110+R()*190;burst+=`<i class="pc" style="--dx:${Math.cos(a)*d|0}px;--dy:${Math.sin(a)*d|0}px;--r:${R()*900-450|0}deg;background:${cols[i%5]};width:${5+R()*7|0}px;height:${8+R()*12|0}px"></i>`}
 const word=[...'The End.'].map((c,i)=>c===' '?'<span class="sp"></span>':`<span style="--i:${i}">${c}</span>`).join('');
 const cv=b.cover?`<div class="fc" style="background-image:url(${b.cover})"></div>`:`<div class="fc"><em>${esc(b.title)}</em></div>`;
 return `<div class="fin">
 <div class="stage"><i class="ring" style="animation-delay:1.2s"></i><i class="ring" style="animation-delay:1.4s"></i><i class="ring" style="animation-delay:1.6s"></i><div class="cwrap">${cv}</div><div class="burst">${burst}</div></div>
 <h1 class="end" aria-label="The End">${word}</h1>
 <p class="ft">You finished <strong>${esc(b.title)}</strong></p>
 <div class="stats"><div class="st"><b data-k="time" data-t="${b.secs||0}">0</b><span>time reading</span></div><div class="st"><b data-k="pg" data-t="${(b.vis||[]).length}">0</b><span>pages read of ${b.pages.length}</span></div></div>
 <div class="acts"><button class="fb main" onclick="restart(${b.id})">Start over</button><button class="fb" onclick="go('home')">Back to library</button></div>
 </div>`;
}
const pg=()=>{const b=book();return b.pages[b.page].split('\n\n').map(p=>`<p>${esc(p)}</p>`).join('')};
function notes(){
 return hdr("go('ctrl')",'Bookmark')+`<div class="body"><h2>Bookmarked pages</h2>${S.notes.length?S.notes.map((n,i)=>{const b=S.books.find(x=>x.id===n.b);return b?`<button class="note" onclick="S.cur=${n.b};book().page=${n.p};go('read')"><b>${esc(b.title)} · Page ${n.p+1}</b>${esc(b.pages[n.p].slice(0,110))}…</button>`:''}).join(''):'<p class="empty">Pages you save while reading appear here. Open a book, tap the center of the page, then choose Save Page.</p>'}</div>`;
}
function text(){
 return hdr(`go('${S.setFrom==='rctrl'&&book()?'rctrl':'ctrl'}')`,'Settings')+`<div class="body"><h2>Text size</h2>
 <input class="slider" type="range" min="11" max="24" value="${S.size}" aria-label="Text size" oninput="S.size=+this.value;$('#pv').style.setProperty('--fs',S.size+'px');save()">
 <div class="text" id="pv" style="--fs:${S.size}px;padding:0;flex:none;cursor:default">The quick brown fox jumps over the lazy dog. Adjust until the page feels right.</div>
 <h2 style="margin-top:22px">Device frame</h2>
 <div class="frames" role="radiogroup" aria-label="Device frame color">${FR.map(([k,n])=>`<button class="fr${frameKey()===k?' on':''}" role="radio" aria-checked="${frameKey()===k}" onclick="setFrame('${k}')"><i class="sw sw-${k}"></i>${n}</button>`).join('')}</div>
 <button class="item" style="margin-top:14px" onclick="tog('night')">${svg('night')} Night mode <span>${S.night?'On':'Off'}</span></button>
 <button class="item" onclick="tog('dark')">${svg('eye')} Dark mode <span>${S.dark?'On':'Off'}</span></button>
 <button class="item" onclick="tog('anim')">${svg('eye')} Animations <span>${S.anim?'On':'Off'}</span></button>
 <button class="item" onclick="tog('ccolor')">${svg('eye')} Book covers in color <span>${S.ccolor?'On':'Off'}</span></button></div>`;
}
const FR=[['white','White'],['dark','Dark'],['gold','Shiny Gold'],['rose','Shiny Rose Gold'],['blue','Deep Blue']];
const frameKey=()=>S.frame||(S.dark?'dark':'white');
function setFrame(k){S.frame=k;save();render()}
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const V={home,books,ctrl,read,rctrl,track,chapters,notes,text,done};

/* actions */
function tap(e){const r=e.currentTarget.getBoundingClientRect(),x=(e.clientX-r.left)/r.width;
 if(x<.3)turn(-1);else if(x>.7)turn(1)}
function turn(d){const b=book(),n=b.page+d;
 if(S.spK===b.id+'|'+b.page){
  if(d>0&&S.sp<(S.nsub||1)-1){S.sp++;b.last=Date.now();S.pt='next';return render()}
  if(d<0&&S.sp>0){S.sp--;b.last=Date.now();S.pt='prev';return render()}}
 if(n<0)return toast('First page');if(n>=b.pages.length)return finish();
 b.page=n;b.last=Date.now();S.spK=b.id+'|'+n;S.sp=d>0?0:1e6;S.pt=d>0?'next':'prev';save();render()}
function finish(){const b=book();b.done=Date.now();save();go('done')}
function restart(id){const b=S.books.find(x=>x.id===id);if(b){b.page=0;b.secs=0;b.vis=[];b.done=0}openBook(id)}
const fmtT=n=>n<60?`${n}<small>sec</small>`:n<3600?`${Math.floor(n/60)}<small>min</small>`:`${Math.floor(n/3600)}<small>h</small> ${Math.floor(n%3600/60)}<small>m</small>`;
function runCount(){document.querySelectorAll('.st b').forEach((el,i)=>{const to=+el.dataset.t,f=el.dataset.k==='time'?fmtT:(n=>String(n));
 if(!S.anim){el.innerHTML=f(to);return}
 const t0=performance.now()+1550+i*250,dur=1400;
 const tick=now=>{const p=Math.min(1,Math.max(0,(now-t0)/dur)),e=1-Math.pow(1-p,3);el.innerHTML=f(Math.round(to*e));if(p<1)requestAnimationFrame(tick)};requestAnimationFrame(tick)})}
function jump(d){const b=book();let t;
 if(b.ch&&b.ch.length){const st=b.ch.map(x=>x.s);let i=0;st.forEach((v,k)=>{if(v<=b.page)i=k});
  t=d>0?st[Math.min(st.length-1,i+1)]:(b.page>st[i]?st[i]:st[Math.max(0,i-1)])}
 else{const g=Math.floor(b.page/10);t=d>0?(g+1)*10:(b.page%10?g*10:Math.max(0,g-1)*10)}
 b.page=Math.max(0,Math.min(b.pages.length-1,t));save();render()}
function scrub(v){const k=book();k.page=+v-1;fitText($('#tp'),k,0);$('#lbl').innerHTML=chInfo(k,'Page '+(k.page+1));save()}
function toggleGest(){S.gest=!S.gest;save();render();toast(S.gest?'Gestures on':'Gestures off')}
function toggleFull(){S.full=!S.full;save();
 try{if(S.full&&!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>{});else if(!S.full&&document.fullscreenElement)document.exitFullscreen?.().catch(()=>{})}catch(e){}
 render();toast(S.full?'Full View on':'Full View off')}
function toggleDmenu(){S.dmenu=!S.dmenu;render()}
function tog(k){S[k]=!S[k];S.dmenu=false;save();render()}
function savePage(){const b=book();if(!S.notes.some(n=>n.b===b.id&&n.p===b.page))S.notes.push({b:b.id,p:b.page});save();toast('Page bookmarked')}
function cycleTO(){S.timeout=S.timeout===0?1:S.timeout===1?5:0;save();resetSleep();render()}
function bright(){$('#scr').style.opacity=S.bright/100*.4+.6}
let sl;function resetSleep(){clearTimeout(sl);if(S.timeout)sl=setTimeout(()=>{const d=document.createElement('div');d.className='sleep';d.textContent='Paper';d.onclick=()=>{d.remove();resetSleep()};$('#scr').append(d)},S.timeout*60000)}
function render(){
 const s=$('#scr'),cur=S.screen,prev=S.shown,rg=['read','rctrl','track'];
 s.className='screen'+(S.dark?' dark':'')+(S.night?' warm':'')+(S.ccolor?' cc':'');
 $('.device').className='device'+(S.anim?'':' noanim')+' f-'+frameKey()+(S.dark?' dark':'')+(S.full?' full':'');
 document.documentElement.dataset.theme=S.dark?'dark':'light';
 s.innerHTML=V[S.screen]();
 if(rg.includes(cur)){const bk=book();if(bk)layoutText(cur,bk)}
 if(S.sheet)s.insertAdjacentHTML('beforeend',sheet());
 if(prev!==cur){
  if(rg.includes(prev)&&rg.includes(cur))s.querySelector('.bar,.trk')?.classList.add('drop-in');
  else if(cur!=='chapters'){s.classList.add('enter-'+({read:'zoom',ctrl:'drop'}[cur]||'fade'));
   if(['home','ctrl','notes','text'].includes(cur)){s.classList.add('stag');s.querySelectorAll('.body>*').forEach((e,i)=>e.style.setProperty('--i',i))}}
 }
 if(S.pt){$('.text')?.classList.add('turn-'+S.pt);S.pt=null}
 if(cur==='read'){const k=book();if(k){k.vis=k.vis||[];if(!k.vis.includes(k.page))k.vis.push(k.page)}}
 if(cur==='chapters'){const c=$('#chcur');if(c)c.scrollIntoView({block:'center'})}
 if(cur==='done'&&prev!==cur){runCount();if(S.anim)setTimeout(()=>{try{navigator.vibrate&&navigator.vibrate([40,60,40])}catch(e){}},1250)}
 S.shown=cur;bright();resetSleep();
}
document.addEventListener('keydown',e=>{if(S.screen==='read'||S.screen==='rctrl'){if(e.key==='ArrowRight')turn(1);if(e.key==='ArrowLeft')turn(-1)}});
$('#file').onchange=e=>{importFiles([...e.target.files]);e.target.value=''};
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{e.preventDefault();importFiles([...e.dataTransfer.files])});
setInterval(()=>{if(S.screen==='home'||S.screen==='ctrl'){const b=document.querySelector('.top b');if(b)b.textContent=clock()}},20000);

setInterval(()=>{const b=book();if(b&&['read','rctrl','track','chapters'].includes(S.screen)&&!document.hidden){b.secs=(b.secs||0)+1;if(b.secs%15===0)save()}},1000);
/* long press on a book */
let lpT,lpDone=false,lx=0,ly=0;
const sc=$('#scr');
sc.addEventListener('pointerdown',e=>{lpDone=false;
 const lpEl=e.target.closest('[data-lp]');
 if(lpEl&&S.screen==='read'){lx=e.clientX;ly=e.clientY;clearTimeout(lpT);const dest=lpEl.dataset.lp;lpT=setTimeout(()=>{lpDone=true;try{navigator.vibrate&&navigator.vibrate(15)}catch(_){}go(dest)},480);return}
 const t=e.target.closest('[data-bid]');if(!t)return;lx=e.clientX;ly=e.clientY;clearTimeout(lpT);
 lpT=setTimeout(()=>{lpDone=true;try{navigator.vibrate&&navigator.vibrate(15)}catch(_){}openSheet(Number(t.dataset.bid))},480)});
sc.addEventListener('pointermove',e=>{if(Math.abs(e.clientX-lx)>8||Math.abs(e.clientY-ly)>8)clearTimeout(lpT)});
['pointerup','pointercancel','pointerleave'].forEach(n=>sc.addEventListener(n,()=>clearTimeout(lpT)));
sc.addEventListener('click',e=>{if(lpDone||Date.now()-swAt<350){e.stopPropagation();e.preventDefault();lpDone=false}},true);
sc.addEventListener('contextmenu',e=>{if(e.target.closest('[data-bid],[data-lp]'))e.preventDefault()});

/* swipe left/right on the page to turn it */
let swOn=false,swX=0,swY=0,swAt=0;
sc.addEventListener('pointerdown',e=>{swOn=S.screen==='read'&&!!S.gest&&!!e.target.closest('.text');swX=e.clientX;swY=e.clientY});
sc.addEventListener('pointercancel',()=>{swOn=false});
sc.addEventListener('pointerup',e=>{if(!swOn)return;swOn=false;const dx=e.clientX-swX,dy=e.clientY-swY;
 if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){swAt=Date.now();turn(dx<0?1:-1)}});

/* swipe left on PaperHome resumes the last book */
let sx=0,sy=0,sOn=false;
sc.addEventListener('pointerdown',e=>{sOn=!e.target.closest('.row,input');sx=e.clientX;sy=e.clientY});
sc.addEventListener('pointerup',e=>{if(!sOn)return;sOn=false;const dx=e.clientX-sx,dy=e.clientY-sy;
 if(S.gest&&S.screen==='home'&&S.q===null&&!S.sheet&&!lpDone&&dx<-70&&Math.abs(dx)>Math.abs(dy)*1.6){
  const b=[...S.books].filter(x=>x.last).sort((a,c)=>c.last-a.last)[0]||book();if(!b)return toast('No book to resume');openBook(b.id)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.screen==='home'&&S.q!==null)closeSearch()});

(async()=>{
 await idb();const st=await get('state');
 if(st)Object.assign(S,st);S.timeout=0;
 if(!S.books.length){
  const lo='Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed metus nunc, semper et dolor at, tincidunt sagittis enim. Sed sollicitudin dolor id velit condimentum scelerisque. Lorem ipsum dolor sit amet, consectetur adipiscing elit. Aenean tincidunt tortor, at accumsan metus volutpat vel.';
  S.books.push({id:1,title:'Sample: Reading Paper',pages:Array.from({length:24},(_,i)=>i===0?'Welcome to Paper. Tap the right side of a page to go forward, the left side to go back, and the center for reading controls. Add your own books from the home screen.\n\n'+lo:lo+'\n\n'+lo.split('. ').reverse().join('. ')),page:0,last:0,added:Date.now()});
 }
 S.screen='home';render();
})();
const refit=()=>{S.fc={};if(['read','rctrl','track'].includes(S.screen)&&book())render()};
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(refit,150)});
try{document.fonts.addEventListener('loadingdone',refit)}catch(e){}
</script><script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
</body></html>
